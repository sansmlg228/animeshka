<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎌 Аниме Библиотека</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="header-inner">
            <!-- ЛЕВЫЙ УГОЛ: Логотип (200x100) -->
            <div class="logo-box">
                <!-- Замените src на ссылку на вашу картинку, если она есть -->
                <img src="" alt="Logo" class="site-logo" onerror="this.style.display='none'; this.parentElement.innerHTML='🎌<br><span>AnimeLib</span>';">
            </div>

            <!-- ЦЕНТР: Статистика и Фильтры -->
            <div class="header-center">
                <div id="stats" class="stats"></div>
                
                <div class="toolbar">
                    <input type="text" id="library-search" placeholder="🔍 Поиск по библиотеке..." autocomplete="off">
                    <select id="genre-filter">
                        <option value="all">Все жанры</option>
                    </select>
                    <select id="sort-select">
                        <option value="title-asc">Название А→Я</option>
                        <option value="title-desc">Название Я→А</option>
                        <option value="status">По статусу</option>
                        <option value="added-desc">Сначала новые</option>
                        <option value="added-asc">Сначала старые</option>
                    </select>
                </div>
            </div>

            <!-- ПРАВЫЙ УГОЛ: Кнопки Экспорт/Импорт -->
            <div class="header-right">
                <button id="export-btn" class="ghost" title="Скачать библиотеку в JSON">⬇ Экспорт</button>
                <label for="import-input" class="ghost" title="Загрузить библиотеку из JSON">⬆ Импорт</label>
                <input type="file" id="import-input" accept=".json" hidden>
            </div>
        </div>
    </header>

    <main>
        <div id="status-message"></div>
        <div id="anime-grid" class="anime-grid"></div>
    </main>

    <!-- Плавающая кнопка добавления (FAB) -->
    <button id="fab-add" class="fab" title="Добавить аниме">+</button>

    <!-- МОДАЛЬНОЕ ОКНО: ДОБАВЛЕНИЕ АНИМЕ -->
    <div id="add-modal" class="modal-backdrop hidden">
        <div class="modal">
            <h2>Добавить аниме</h2>
            <p class="modal-subtitle">Введите название на русском, английском или ромадзи</p>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Например: Атака титанов..." autocomplete="off">
                <button id="search-btn">Найти</button>
            </div>
            
            <button id="add-cancel" class="ghost btn-full" style="margin-top: 16px;">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ВЫБОР ВЕРСИИ -->
    <div id="version-modal" class="modal-backdrop hidden">
        <div class="modal">
            <h2>Выберите версию</h2>
            <p class="modal-subtitle">Найдено несколько связанных тайтлов. Какую версию вы смотрели?</p>
            <div id="version-options" class="version-options"></div>
            <button id="version-cancel" class="ghost btn-full">Отмена</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
